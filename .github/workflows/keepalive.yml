# Cada 10 minutos consulta tu servidor. Así:
#  - el servidor de Render (plan gratuito) no se "duerme" y el portal abre rápido
#  - Supabase recibe actividad y no vuelve a pausar el proyecto
#  - si algo falla, GitHub te envía un correo de aviso
name: Mantener servidor y base de datos activos

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:   # permite ejecutarlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar servidor y base de datos
        run: |
          curl --fail --silent --show-error --max-time 120 \
               --retry 2 --retry-delay 15 --retry-all-errors \
               "https://facturacion-servidor-1.onrender.com/health?deep=1"
